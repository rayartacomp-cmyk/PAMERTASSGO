<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - PAMERTASS</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="../assets/images/favicon.ico" type="image/x-icon">
    <script>
        // Clear login data and redirect to home
        localStorage.removeItem('pamertassLoggedIn');
        localStorage.removeItem('pamertassUser');
        sessionStorage.removeItem('pamertassLoggedIn');
        sessionStorage.removeItem('pamertassUser');
        
        // Clear admin data
        sessionStorage.removeItem('adminLoggedIn');
        sessionStorage.removeItem('adminUsername');
        
        setTimeout(() => {
            window.location.href = '../index.html';
        }, 2000);
    </script>
</head>
<body>
    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);">
        <div style="text-align: center; padding: 40px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
            <div style="font-size: 48px; color: #3498db; margin-bottom: 20px;">
                <i class="fas fa-sign-out-alt"></i>
            </div>
            <h1 style="color: #2c3e50; margin-bottom: 10px;">Logout Berhasil</h1>
            <p style="color: #7f8c8d; margin-bottom: 30px;">Anda telah berhasil logout dari sistem PAMERTASS</p>
            <p style="color: #95a5a6; font-size: 14px;">Mengarahkan ke halaman utama...</p>
            <div style="margin-top: 30px;">
                <a href="../index.html" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; background-color: #3498db; color: white; text-decoration: none; border-radius: 6px; font-weight: 600;">
                    <i class="fas fa-home"></i> Ke Halaman Utama
                </a>
            </div>
        </div>
    </div>
</body>
</html>
