<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PAMERTASS</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="../assets/images/favicon.ico" type="image/x-icon">
</head>
<body class="admin-login-page">
    <div class="admin-login-container">
        <div class="admin-login-card">
            <div class="login-header">
                <div class="login-logo">
                    <i class="fas fa-user-shield"></i>
                    <h1>PAMERTASS ADMIN</h1>
                </div>
                <p>Panel Administrator - PMR SMAN 17 Surabaya</p>
            </div>
            
            <form id="adminLoginForm" class="admin-login-form">
                <div class="form-group">
                    <label for="adminUsername">
                        <i class="fas fa-user"></i> Username Admin
                    </label>
                    <input type="text" id="adminUsername" name="username" required 
                           placeholder="Masukkan username admin">
                </div>
                
                <div class="form-group">
                    <label for="adminPassword">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" id="adminPassword" name="password" required 
                           placeholder="Masukkan password">
                </div>
                
                <button type="submit" class="btn-admin-login">
                    <i class="fas fa-sign-in-alt"></i> Login sebagai Admin
                </button>
                
                <div class="login-divider">
                    <span>ATAU</span>
                </div>
                
                <div class="alternative-login">
                    <a href="../member/login.html" class="btn-member-login">
                        <i class="fas fa-user"></i> Login sebagai Anggota
                    </a>
                    <a href="../index.html" class="btn-back-home">
                        <i class="fas fa-home"></i> Kembali ke Home
                    </a>
                </div>
            </form>
            
            <div class="login-footer">
                <p><i class="fas fa-info-circle"></i> Hubungi super admin jika lupa password</p>
                <p class="version">v1.0.0 | © 2026 PAMERTASS</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            
            const adminCredentials = {
                username: 'admin',
                password: 'pamertass2026'
            };
            
            if(username === adminCredentials.username && password === adminCredentials.password) {
                sessionStorage.setItem('adminLoggedIn', 'true');
                sessionStorage.setItem('adminUsername', username);
                
                alert('Login admin berhasil!');
                window.location.href = 'dashboard.html';
            } else {
                alert('Username atau password admin salah!');
            }
        });
        
        if(sessionStorage.getItem('adminLoggedIn')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
